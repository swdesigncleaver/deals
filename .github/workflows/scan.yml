name: Watch cheapfood.co.uk

on:
  schedule:
    # Every 30 minutes. GitHub doesn't guarantee exact timing on the free
    # tier — under load this can slip by several minutes, which is fine
    # for this use case.
    - cron: "*/30 * * * *"
  # Lets you trigger a run by hand from the Actions tab, e.g. for the
  # first run or to debug the workflow itself.
  workflow_dispatch: {}

# Needed so the workflow can commit the updated feed/state back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the watcher
        run: |
          mkdir -p docs
          python3 cheapfood_watch.py \
            "https://cheapfood.co.uk/food/sports-energy/?sort=newest" \
            -k protein \
            --state state.json \
            --feed docs/feed.xml \
            --title "cheapfood.co.uk — protein" \
            -v

      - name: Commit updated feed and state, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/feed.xml
          git diff --staged --quiet || git commit -m "Update feed [skip ci]"
          git push
